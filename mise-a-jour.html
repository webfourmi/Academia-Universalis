<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mise à jour · Academia Universalis</title><style>body{max-width:36rem;margin:3rem auto;padding:0 1rem;font:1rem/1.6 system-ui;color:#183b38;background:#f4f6f5}button{font:inherit;padding:.75rem 1rem;background:#183b38;color:white;border:0;border-radius:.5rem}</style></head>
<body><main><h1>Mettre à jour Academia Universalis</h1>
<p>Cette page actualise l’application sur ce navigateur. Tes notes, ton rythme et ta progression sont conservés.</p>
<button id="refresh">Installer la mise à jour</button>
<p id="status" role="status"></p><p><a href="./">Ouvrir le campus</a></p></main>
<script>
const button = document.querySelector('#refresh');
const status = document.querySelector('#status');
button.onclick = async () => {
  button.disabled = true;
  status.textContent = 'Vérification de la version disponible…';
  try {
    const scope = new URL('./', location.href).href;
    const scriptURL = new URL('./sw.js?recovery=031', scope).href;
    const registration = await navigator.serviceWorker.register(scriptURL, {scope, updateViaCache:'none'});
    const worker = [registration.installing, registration.waiting, registration.active]
      .find(candidate => candidate?.scriptURL === scriptURL);
    if (!worker) throw new Error('Mise à jour introuvable');
    if (worker) {
      await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => finish(new Error('Délai dépassé')), 25000);
        function finish(error) {
          clearTimeout(timeout);
          worker.removeEventListener('statechange', advance);
          error ? reject(error) : resolve();
        }
        function advance() {
          if (worker.state === 'installed') worker.postMessage('SKIP_WAITING');
          if (worker.state === 'activated') finish();
          if (worker.state === 'redundant') finish(new Error('Mise à jour interrompue'));
        }
        worker.addEventListener('statechange', advance);
        advance();
      });
    }
    if (navigator.serviceWorker.controller?.scriptURL !== scriptURL) {
      await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => {
          navigator.serviceWorker.removeEventListener('controllerchange', verify);
          reject(new Error('Application non actualisée'));
        }, 7000);
        function verify() {
          if (navigator.serviceWorker.controller?.scriptURL !== scriptURL) return;
          clearTimeout(timeout);
          navigator.serviceWorker.removeEventListener('controllerchange', verify);
          resolve();
        }
        navigator.serviceWorker.addEventListener('controllerchange', verify);
        verify();
      });
    }
    const response = await fetch('./index.html', {cache:'no-store'});
    const html = await response.text();
    if (!response.ok || !html.includes('id="updates"')) throw new Error('Version précédente détectée');
    status.textContent = 'Le campus est à jour dans ce navigateur. Ouvre le campus ci-dessous pour vérifier le numéro de version.';
  } catch {
    status.textContent = 'La mise à jour n’a pas abouti. Vérifie la connexion et réessaie dans le navigateur utilisé pour installer le campus.';
  } finally {
    button.disabled = false;
  }
};
</script></body></html>
